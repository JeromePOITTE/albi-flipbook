<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Albi — Merveille de briques et de lumière | Extrait</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#161616;font-family:Arial,sans-serif;color:#fff;overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#101010;gap:10px}.title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{display:flex;align-items:center;gap:6px}button{border:0;border-radius:7px;background:#2c2c2c;color:#fff;padding:8px 11px;cursor:pointer;font-size:16px}button:hover{background:#444}button:disabled{opacity:.35;cursor:default}.counter{font-size:12px;min-width:60px;text-align:center}.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:16px;perspective:1800px;overflow:hidden}.book{position:relative;max-width:100%;max-height:100%;filter:drop-shadow(0 12px 24px #0008);transform-origin:center;transition:transform .2s}.book img{display:block;max-width:calc(100vw - 32px);max-height:calc(100vh - 92px);width:auto;height:auto;object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}.turn-next{animation:next .42s ease}.turn-prev{animation:prev .42s ease}@keyframes next{0%{transform:rotateY(0) scale(1)}48%{transform:rotateY(-13deg) scale(.985)}100%{transform:rotateY(0) scale(1)}}@keyframes prev{0%{transform:rotateY(0) scale(1)}48%{transform:rotateY(13deg) scale(.985)}100%{transform:rotateY(0) scale(1)}}.hint{position:absolute;bottom:7px;font-size:11px;color:#aaa}.zoomed .book img{max-width:none;max-height:none;width:150vw}.zoomed .stage{overflow:auto;justify-content:flex-start;align-items:flex-start}.zoomed .book{margin:auto}.navzone{position:absolute;top:0;bottom:0;width:22%;z-index:2}.left{left:0}.right{right:0}@media(max-width:700px){.bar{height:48px;padding:0 8px}.title{font-size:12px}.stage{padding:8px}.book img{max-width:calc(100vw - 16px);max-height:calc(100vh - 72px)}button{padding:7px 9px}.hint{display:none}}
</style></head><body><div class="app" id="app"><div class="bar"><div class="title">ALBI — Merveille de briques et de lumière · Extrait</div><div class="tools"><button id="prev" title="Page précédente">‹</button><span class="counter" id="counter"></span><button id="next" title="Page suivante">›</button><button id="zoom" title="Zoom">⌕</button><button id="full" title="Plein écran">⛶</button></div></div><div class="stage"><div class="navzone left" id="left"></div><div class="book" id="book"><img id="page" alt="Extrait du livre Albi"></div><div class="navzone right" id="right"></div><div class="hint">Cliquez à droite ou à gauche pour feuilleter · flèches du clavier disponibles</div></div></div><script>
const pages=Array.from({length:13},(_,i)=>`pages/page-${String(i+1).padStart(2,'0')}.jpg`);let i=0;const img=document.getElementById('page'),book=document.getElementById('book'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),app=document.getElementById('app');
function show(dir){img.src=pages[i];counter.textContent=`${i+1} / ${pages.length}`;prev.disabled=i===0;next.disabled=i===pages.length-1;if(dir){book.classList.remove('turn-next','turn-prev');void book.offsetWidth;book.classList.add(dir==='n'?'turn-next':'turn-prev')}}
function go(d){const n=i+d;if(n<0||n>=pages.length)return;i=n;show(d>0?'n':'p')}prev.onclick=()=>go(-1);next.onclick=()=>go(1);document.getElementById('left').onclick=()=>go(-1);document.getElementById('right').onclick=()=>go(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1)});document.getElementById('zoom').onclick=()=>app.classList.toggle('zoomed');document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();pages.slice(1,4).forEach(s=>{const x=new Image;x.src=s});show();
</script></body></html>
